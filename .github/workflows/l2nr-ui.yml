name: L2NR UI
# Build and publish the installable Dashboard 2 package with configurable display settings.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "l2nr-ui.manifest.json"
      - ".github/workflows/l2nr-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: DariuszPiskorowski/l2nr-ui/.github/workflows/analyze-ui-node.yml@main
    with:
      command: build
      artifact_name: crimson-steam-gauge-node-red
